<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chattr</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2368b5f8'/%3E%3Ctext x='50%25' y='52%25' dominant-baseline='central' text-anchor='middle' font-family='Verdana,sans-serif' font-weight='bold' font-size='42' fill='%23000'%3EC%3C/text%3E%3C/svg%3E">
<style>
  body { margin: 8px; background: #fff; font-family: Verdana, Geneva, sans-serif; font-size: 13px; color: #000; }
  .wrap { max-width: 900px; margin: 0 auto; background: #f6f6ef; padding-bottom: 16px; }
  header { background: #68b5f8; padding: 5px 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header a { color: #000; text-decoration: none; }
  header .right { margin-left: auto; }
  main { padding: 10px 12px; }
  a { color: #000; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .meta, .meta a { color: #828282; font-size: 11px; }
  .item { display: flex; gap: 6px; margin-bottom: 10px; align-items: flex-start; }
  .rank { color: #828282; min-width: 22px; text-align: right; }
  .vote { background: none; border: none; color: #828282; cursor: pointer; padding: 0; font-size: 11px; }
  .vote:hover, .vote.voted { color: #2b82d9; }
  .body { white-space: pre-wrap; margin: 10px 0; line-height: 1.45; }
  .comment { margin-top: 10px; border-left: 1px solid #dcdcd2; padding-left: 8px; }
  form.box { display: flex; flex-direction: column; gap: 8px; max-width: 480px; margin-top: 10px; }
  input, textarea, select { font-family: inherit; font-size: 13px; padding: 5px; border: 1px solid #ccc; }
  button.btn { width: fit-content; padding: 5px 12px; cursor: pointer; }
  .err { color: #c00; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #e4e4da; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b><a href="#/">Chattr</a></b>
    <a href="#/">fóruns</a> |
    <a href="#/posts">posts</a> |
    <a href="#/criar-forum">criar fórum</a> |
    <a id="nav-submit" href="#/enviar">enviar post</a>
    <span class="right" id="nav-user"></span>
  </header>
  <main id="app"></main>
</div>

<script>
const KEY = "chattr_v1";
const $app = document.getElementById("app");
const $navSubmit = document.getElementById("nav-submit");
const $navUser = document.getElementById("nav-user");

function loadDB() {
  const raw = localStorage.getItem(KEY);
  if (raw) return JSON.parse(raw);
  const seed = {
    nextId: 1,
    currentUser: null,
    users: {},
    postVotes: {},
    forumStars: {},
    joinedForums: {},
    forums: [
      { slug: "R6", desc: "", stars: 8, visitors: 0, joined: 0, createdAt: Date.now() }
    ],
    posts: [],
    comments: []
  };
  saveDB(seed);
  return seed;
}

function saveDB(db) {
  localStorage.setItem(KEY, JSON.stringify(db));
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function timeAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return `há ${s}s`;
  if (s < 3600) return `há ${Math.floor(s / 60)}m`;
  if (s < 86400) return `há ${Math.floor(s / 3600)}h`;
  return `há ${Math.floor(s / 86400)}d`;
}

function renderNavUser(db) {
  if (db.currentUser) {
    $navUser.innerHTML = `<b>${esc(db.currentUser)}</b> (<a href="#/conta">configurações</a> | <a href="#" id="btn-logout">sair</a>)`;
    document.getElementById("btn-logout").onclick = e => {
      e.preventDefault();
      const d = loadDB();
      d.currentUser = null;
      saveDB(d);
      render(false);
    };
  } else {
    $navUser.innerHTML = `<a href="#/conta">entrar</a>`;
  }
}

function forumHTML(f, rank, db) {
  const postCount = db.posts.filter(p => p.forum === f.slug).length;
  const luxKey = `${db.currentUser || "_"}:${f.slug}`;
  const luxText = `${f.stars} Lux`;
  const visText = `${f.visitors} ${f.visitors === 1 ? "visitante" : "visitantes"}`;
  const joinText = `${f.joined} ${f.joined === 1 ? "pessoa já entrou" : "pessoas já entraram"}`;
  return `
    <div class="item">
      ${rank ? `<span class="rank">${rank}.</span>` : ""}
      <button class="vote ${db.forumStars[luxKey] ? "voted" : ""}" onclick="toggleForumStar('${esc(f.slug)}')" title="dar Lux">▲</button>
      <div>
        <div>
          <a href="#/f/${esc(f.slug)}"><b>${esc(f.slug)}</b></a>
          ${f.desc ? `<span class="meta">— ${esc(f.desc)}</span>` : ""}
        </div>
        <div class="meta">
          ${luxText} | ${visText} | ${joinText} | <a href="#/f/${esc(f.slug)}">${postCount} ${postCount === 1 ? "post" : "posts"}</a>
        </div>
      </div>
    </div>`;
}

function postHTML(p, rank, db) {
  const cCount = db.comments.filter(c => c.postId === p.id).length;
  const voteKey = `${db.currentUser || "_"}:${p.id}`;
  return `
    <div class="item">
      ${rank ? `<span class="rank">${rank}.</span>` : ""}
      <button class="vote ${db.postVotes[voteKey] ? "voted" : ""}" onclick="togglePostVote(${p.id})" title="votar">▲</button>
      <div>
        <div><a href="#/post/${p.id}">${esc(p.title)}</a></div>
        <div class="meta">
          ${p.points} ${p.points === 1 ? "ponto" : "pontos"} por ${esc(p.author)} ${timeAgo(p.createdAt)}
          | <a href="#/f/${esc(p.forum)}">${esc(p.forum)}</a>
          | <a href="#/post/${p.id}">${cCount} ${cCount === 1 ? "comentário" : "comentários"}</a>
        </div>
      </div>
    </div>`;
}

function renderComments(comments, parentId, postId) {
  return comments
    .filter(c => c.parentId === parentId)
    .map(c => `
      <div class="comment">
        <div class="meta">${esc(c.author)} ${timeAgo(c.createdAt)} | <a href="#/post/${postId}?reply=${c.id}">responder</a></div>
        <div class="body">${esc(c.body)}</div>
        ${renderComments(comments, c.id, postId)}
      </div>
    `).join("");
}

window.toggleForumStar = function(slug) {
  const db = loadDB();
  if (!db.currentUser) return render(false, "Entre na sua conta para dar Lux.");
  const forum = db.forums.find(f => f.slug === slug);
  if (!forum) return;
  const key = `${db.currentUser}:${slug}`;
  if (db.forumStars[key]) {
    delete db.forumStars[key];
    forum.stars = Math.max(0, forum.stars - 1);
  } else {
    db.forumStars[key] = true;
    forum.stars += 1;
  }
  saveDB(db);
  render(false);
};

window.togglePostVote = function(id) {
  const db = loadDB();
  if (!db.currentUser) return render(false, "Entre na sua conta para votar.");
  const post = db.posts.find(p => p.id === id);
  if (!post) return;
  const key = `${db.currentUser}:${id}`;
  if (db.postVotes[key]) {
    delete db.postVotes[key];
    post.points = Math.max(0, post.points - 1);
  } else {
    db.postVotes[key] = true;
    post.points += 1;
  }
  saveDB(db);
  render(false);
};

window.deletePost = function(id) {
  const db = loadDB();
  if (!db.currentUser) return;
  const post = db.posts.find(p => p.id === id && p.author === db.currentUser);
  if (!post) return;
  db.posts = db.posts.filter(p => p.id !== id);
  db.comments = db.comments.filter(c => c.postId !== id);
  saveDB(db);
  render(false);
};

function render(countVisit = true, error = "") {
  const db = loadDB();
  renderNavUser(db);

  const [path, query] = (location.hash.slice(1) || "/").split("?");
  const params = new URLSearchParams(query || "");
  const parts = path.split("/").filter(Boolean);

  $navSubmit.href = parts[0] === "f" && parts[1] ? `#/enviar/${parts[1]}` : "#/enviar";
  const errBox = error ? `<div class="err">${esc(error)}</div>` : "";

  // 1. Conta
  if (parts[0] === "conta") {
    if (db.currentUser) {
      const myPosts = db.posts
        .filter(p => p.author === db.currentUser)
        .sort((a, b) => b.createdAt - a.createdAt);

      $app.innerHTML = errBox + `
        <h3>Configurações da conta</h3>
        <p class="meta">Logado como <b>${esc(db.currentUser)}</b></p>
        <h4>Meus posts</h4>
        ${myPosts.length
          ? myPosts.map(p => `
              <div class="row">
                <div>
                  <a href="#/post/${p.id}"><b>${esc(p.title)}</b></a>
                  <span class="meta">em ${esc(p.forum)} • ${timeAgo(p.createdAt)}</span>
                </div>
                <button class="btn" onclick="deletePost(${p.id})">Apagar</button>
              </div>
            `).join("")
          : `<p class="meta">Você ainda não publicou nenhum post.</p>`}`;
      return;
    }

    $app.innerHTML = errBox + `
      <h3>Entrar</h3>
      <form class="box" id="form-login">
        <input name="name" placeholder="nome" required maxlength="24">
        <input name="pass" type="password" placeholder="senha (até 8 caracteres)" required maxlength="8">
        <button class="btn">Entrar</button>
      </form>
      <hr>
      <h3>Criar conta</h3>
      <form class="box" id="form-register">
        <input name="name" placeholder="nome" required maxlength="24">
        <input name="pass" type="password" placeholder="senha (até 8 caracteres)" required maxlength="8">
        <button class="btn">Criar conta</button>
      </form>`;

    document.getElementById("form-login").onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const pass = e.target.pass.value;
      if (!db.users[name] || db.users[name] !== pass) {
        return render(false, "Nome ou senha incorretos.");
      }
      db.currentUser = name;
      saveDB(db);
      location.hash = "#/";
    };

    document.getElementById("form-register").onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const pass = e.target.pass.value;
      if (name.length < 2) return render(false, "O nome deve ter pelo menos 2 caracteres.");
      if (pass.length < 1 || pass.length > 8) return render(false, "A senha deve ter de 1 a 8 caracteres.");
      if (db.users[name]) return render(false, "Esse nome já está em uso.");
      db.users[name] = pass;
      db.currentUser = name;
      saveDB(db);
      location.hash = "#/";
    };
    return;
  }

  // 2. Criar fórum
  if (parts[0] === "criar-forum") {
    if (!db.currentUser) {
      $app.innerHTML = `<p>Você precisa <a href="#/conta"><b>entrar na sua conta</b></a> para criar um fórum.</p>`;
      return;
    }
    $app.innerHTML = errBox + `
      <h3>Criar fórum</h3>
      <form class="box" id="form-forum">
        <input name="slug" placeholder="nome do fórum (ex: R6, jogos)" required pattern="[A-Za-z0-9_-]{2,24}">
        <input name="desc" placeholder="descrição curta (opcional)">
        <button class="btn">Criar fórum</button>
      </form>`;
    document.getElementById("form-forum").onsubmit = e => {
      e.preventDefault();
      const slug = e.target.slug.value.trim().replace(/[^A-Za-z0-9_-]/g, "");
      const desc = e.target.desc.value.trim();
      if (slug.length < 2) return render(false, "Use pelo menos 2 caracteres (letras, números, - ou _).");
      if (db.forums.some(f => f.slug.toLowerCase() === slug.toLowerCase())) return render(false, "Esse fórum já existe.");
      db.forums.push({ slug, desc, stars: 1, visitors: 0, joined: 0, createdAt: Date.now() });
      db.forumStars[`${db.currentUser}:${slug}`] = true;
      saveDB(db);
      location.hash = `#/f/${slug}`;
    };
    return;
  }

  // 3. Enviar post
  if (parts[0] === "enviar") {
    if (!db.currentUser) {
      $app.innerHTML = `<p>Você precisa <a href="#/conta"><b>entrar na sua conta</b></a> para enviar um post.</p>`;
      return;
    }
    const pre = parts[1] || "";
    $app.innerHTML = errBox + `
      <h3>Enviar post</h3>
      <form class="box" id="form-post">
        <select name="forum">
          ${db.forums.map(f => `<option value="${esc(f.slug)}" ${f.slug === pre ? "selected" : ""}>${esc(f.slug)}</option>`).join("")}
        </select>
        <input name="title" placeholder="título" required maxlength="140">
        <textarea name="body" rows="4" placeholder="texto (opcional)"></textarea>
        <button class="btn">Publicar como ${esc(db.currentUser)}</button>
      </form>`;
    document.getElementById("form-post").onsubmit = e => {
      e.preventDefault();
      const title = e.target.title.value.trim();
      const body = e.target.body.value.trim();
      const forum = e.target.forum.value;
      if (!title) return render(false, "O título é obrigatório.");
      const id = db.nextId++;
      db.posts.push({ id, forum, title, body, author: db.currentUser, points: 1, createdAt: Date.now() });
      db.postVotes[`${db.currentUser}:${id}`] = true;
      saveDB(db);
      location.hash = `#/post/${id}`;
    };
    return;
  }

  // 4. Visualizar post + comentários
  if (parts[0] === "post" && parts[1]) {
    const post = db.posts.find(p => p.id === Number(parts[1]));
    if (!post) return ($app.innerHTML = `<p>Post não encontrado. <a href="#/">Voltar</a></p>`);
    const postComments = db.comments.filter(c => c.postId === post.id);
    const replyId = params.get("reply") ? Number(params.get("reply")) : null;

    const commentForm = db.currentUser
      ? `<form class="box" id="form-comment">
          ${replyId ? `<div class="meta">Respondendo ao comentário #${replyId} (<a href="#/post/${post.id}">cancelar</a>)</div>` : ""}
          <textarea name="body" rows="3" placeholder="escreva um comentário..." required></textarea>
          <button class="btn">Comentar como ${esc(db.currentUser)}</button>
        </form>`
      : `<p class="meta"><a href="#/conta"><b>Entre na sua conta</b></a> para comentar.</p>`;

    $app.innerHTML = errBox + postHTML(post, null, db)
      + (post.body ? `<div class="body">${esc(post.body)}</div>` : "")
      + commentForm
      + `<div style="margin-top:16px">
          ${renderComments(postComments, null, post.id) || '<span class="meta">Sem comentários ainda.</span>'}
        </div>`;

    const form = document.getElementById("form-comment");
    if (form) {
      form.onsubmit = e => {
        e.preventDefault();
        const body = e.target.body.value.trim();
        if (!body) return;
        db.comments.push({ id: db.nextId++, postId: post.id, parentId: replyId, author: db.currentUser, body, createdAt: Date.now() });
        saveDB(db);
        location.hash = `#/post/${post.id}`;
        render(false);
      };
    }
    return;
  }

  // 5. Dentro de um fórum
  if (parts[0] === "f" && parts[1]) {
    const forum = db.forums.find(f => f.slug === parts[1]);
    if (!forum) return ($app.innerHTML = `<p>Fórum não encontrado. <a href="#/">Ver fóruns</a></p>`);
    if (countVisit) {
      forum.visitors += 1;
      const joinKey = `${db.currentUser || "_anon"}:${forum.slug}`;
      if (!db.joinedForums[joinKey]) {
        db.joinedForums[joinKey] = true;
        forum.joined += 1;
      }
      saveDB(db);
    }
    const posts = db.posts
      .filter(p => p.forum === forum.slug)
      .sort((a, b) => b.points - a.points || b.createdAt - a.createdAt);

    $app.innerHTML = errBox + forumHTML(forum, null, db)
      + `<hr>`
      + (posts.length
        ? posts.map((p, i) => postHTML(p, i + 1, db)).join("")
        : `<p class="meta">Nenhum post neste fórum ainda. <a href="#/enviar/${esc(forum.slug)}">Enviar primeiro post</a>.</p>`);
    return;
  }

  // 6. Lista geral de posts
  if (parts[0] === "posts") {
    const posts = [...db.posts].sort((a, b) => b.createdAt - a.createdAt);
    $app.innerHTML = errBox + (posts.length
      ? posts.map((p, i) => postHTML(p, i + 1, db)).join("")
      : `<p class="meta">Nenhum post ainda.</p>`);
    return;
  }

  // 7. Página inicial: lista de fóruns
  const forums = [...db.forums].sort((a, b) => b.stars - a.stars || b.visitors - a.visitors);
  $app.innerHTML = errBox + (forums.length
    ? forums.map((f, i) => forumHTML(f, i + 1, db)).join("")
    : `<p class="meta">Nenhum fórum criado.</p>`);
}

window.addEventListener("hashchange", () => render(true));
render(true);
</script>
</body>
</html>
